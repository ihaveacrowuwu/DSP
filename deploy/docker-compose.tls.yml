# TLS overlay for the demo configuration (NFR4).
#
#   make up-tls          # or:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.tls.yml up -d
#
# NFR4 requires TLS in the deployed/demo configuration. It is an **overlay** rather
# than a change to the base stack for one practical reason: the two mobile apps talk to
# the plain-HTTP development stack through a debug-only cleartext exception, and making
# the base stack HTTPS-only would mean either shipping the self-signed certificate into
# both apps' trust stores or breaking every emulator run. The base file stays the
# development stack; this file is the one the demo is given.
#
# The certificate is generated locally by deploy/tls/generate.sh — no certificate
# authority, no account, no API key (NFR9).

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${TLS_PORT:-8443}:8443"
    volumes:
      - ./tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  # Rebuilt against the HTTPS origin. Vite inlines the API base URL at build time, so
  # a dashboard built for http://localhost:8090 and served over HTTPS would have every
  # request blocked as mixed content — the page would load and silently do nothing.
  web:
    build:
      args:
        VITE_API_BASE_URL: https://localhost:${TLS_PORT:-8443}

  api:
    environment:
      MURAKA_ENV: demo
      CORS_ORIGINS: https://localhost:${TLS_PORT:-8443}
