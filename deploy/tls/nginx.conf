# TLS termination for the demo stack (NFR4).
#
# One origin in front of everything: the dashboard and the API share
# https://localhost:8443, which means the browser makes same-origin requests and CORS
# stops being involved at all. Serving the API on a second HTTPS port would have
# reintroduced it for no benefit.

server {
    listen              8443 ssl;
    http2               on;
    server_name         localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.2 is kept for the Android emulator's system trust store; 1.0 and 1.1 are
    # not, because NFR4 is the requirement this file exists to satisfy.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    # 12 MiB, matching the API's MaxUploadBytes default. Two separate traps here:
    # nginx defaults to **1 MB**, which turns every larger photograph into a 413 the API
    # never sees (verified: a 6.5 MB upload went 201 → 413 with this line removed); and
    # the first version of this file said 8m, guessed rather than read, which would have
    # rejected uploads between 8 and 12 MiB that the API accepts. Both limits are now
    # compared by scripts/check_tls_config.py rather than kept in step by hand.
    client_max_body_size 12m;

    # HSTS is deliberately omitted. With a self-signed certificate it would teach the
    # browser to refuse the plain-HTTP development stack on the same host, which is the
    # kind of help nobody asked for.

    location = /healthz { proxy_pass http://api:8080; }
    location = /readyz  { proxy_pass http://api:8080; }

    location /v1/ {
        proxy_pass       http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # So the API can tell it was reached over TLS even though its own listener is
        # plain HTTP inside the compose network.
        proxy_set_header X-Forwarded-Proto https;
        # Photo uploads are large and the ML round trip is not instant.
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass       http://web:80;
        proxy_set_header Host $host;
    }
}
