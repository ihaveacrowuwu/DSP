# ── JVM / daemon ────────────────────────────────────────────────────────────
# 4 GB is comfortable for Compose + KSP on Apple silicon. Raise it if KSP OOMs.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Build performance ───────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# ── Kotlin ──────────────────────────────────────────────────────────────────
kotlin.code.style=official
# Run the Kotlin compiler inside the Gradle daemon: fewer JVMs, faster builds.
kotlin.compiler.execution.strategy=in-process

# ── AndroidX ────────────────────────────────────────────────────────────────
android.useAndroidX=true
# Non-transitive R classes keep each module's R small and build times low.
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# ── Project flags ───────────────────────────────────────────────────────────
# -PwarningsAsErrors=true turns every Kotlin warning into a build failure. Off by
# default so a local build is not blocked by a deprecation; on in CI.
warningsAsErrors=false
