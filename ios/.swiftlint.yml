# SwiftLint configuration.
# Run:  cd ios && swiftlint
# Fix:  cd ios && swiftlint --fix  (then `swiftformat .` for layout)

included:
  - Muraka
  - MurakaTests
  - MurakaUITests

excluded:
  - Muraka.xcodeproj
  - build
  - DerivedData
  - .build

# ── Rules enabled beyond the defaults ────────────────────────────────────────
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  # ── Layout rules SwiftFormat owns ──────────────────────────────────────────
  # SwiftFormat is the formatter; SwiftLint checks what it cannot fix. Leaving these
  # on makes the two tools fight, and every `swiftformat .` would then produce
  # SwiftLint errors.
  #
  #   trailing_comma  — .swiftformat sets `--commas always`; trailing commas mean
  #                     adding a line touches one line, not two.
  #   opening_brace   — .swiftformat sets `--wrapMultilineStatementBraces`.
  - trailing_comma
  - opening_brace

  # ── Genuinely not wanted ───────────────────────────────────────────────────
  # A UIKit view controller that builds its hierarchy in code is legitimately long;
  # the alternative is a XIB, which reviews far worse.
  - type_body_length
  - function_body_length
  # TODOs are allowed when they carry an owner and a reason — see ../CLAUDE.md.
  - todo

# ── Thresholds ───────────────────────────────────────────────────────────────
line_length:
  warning: 120
  error: 140
  ignores_comments: false
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length: 2
  excluded:
    - id
    - to
    - at
    - db
    - x
    - y

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level: 2

# ── Rules that must never be violated ────────────────────────────────────────
# A force unwrap in the outbox path would crash on exactly the malformed row a diver
# most needs recovered. The only tolerated `try!` is on an in-memory store in tests,
# where a failure genuinely is a programmer error.
force_unwrapping:
  severity: error
force_cast:
  severity: error
force_try:
  severity: error

custom_rules:
  no_print:
    name: "No print()"
    regex: '(?<!\w)print\('
    match_kinds:
      - identifier
    message: "Use OSLog / Logger instead of print()."
    severity: warning
  no_local_synced_flag:
    name: "No client-asserted sync status"
    # D21: the client may state 'waiting to upload' and 'uploading' and nothing else.
    # A user-facing string reading "Synced" is the exact bug the protocol exists to
    # prevent, so it is a lint error rather than a code-review hope.
    regex: '"(Synced|synced|Uploaded|Saved to server)"'
    message: "The client may never assert sync status. Show the server's status, or 'Checking…'. See mobile-shared/sync-protocol.md."
    severity: error

reporter: "xcode"
